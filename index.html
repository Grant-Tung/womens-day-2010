<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Women's Day</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Lora:wght@500;600&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: content-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background: radial-gradient(circle at 50% 40%, #fff1f5, #fbc6d6 55%, #ee93ae);
            font-family: "Dancing Script", cursive;
        }

        /* ---------- Màn hình mở đầu: vẽ bông hồng ---------- */
        .intro {
            position: fixed;
            inset: 0;
            cursor: pointer;
        }

        .intro svg {
            position: absolute;
            inset: 0;
            margin: auto;
            width: 50%;
            height: 50%;
        }

        #text-click {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 12%;
            text-align: center;
            font-weight: 700;
            font-size: clamp(32px, 6vw, 56px);
            color: #c2185b;
            text-shadow: 0 0 6px #fff, 0 0 14px #fff;
            opacity: 0;
            transition: opacity .8s;
            animation: pulse 1.6s ease-in-out infinite;
        }

        #text-click.show {
            opacity: 1;
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.08);
            }
        }

        /* ---------- Sân khấu: trái tim + lồng kính ---------- */
        #castle {
            position: fixed;
            inset: 0;
            overflow: hidden;
            cursor: pointer;
        }

        #stage {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 800px;
            height: 880px;
            transform-origin: 50% 50%;
            transition: transform 1s ease, top 1s ease;
        }

        #heartSvg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .heart-fill {
            fill: rgba(255, 255, 255, .18);
        }

        .heart-line {
            fill: none;
            stroke: #fff;
            stroke-width: 3;
            stroke-linecap: round;
            opacity: .9;
        }

        .heart-text {
            font-family: "Dancing Script", cursive;
            font-weight: 700;
            fill: #b0154a;
            stroke: #fff;
            stroke-width: 6px;
            stroke-linejoin: round;
            paint-order: stroke;
        }

        #scene {
            position: absolute;
            left: 80px;
            top: -15px;
            width: 640px;
            height: 720px;
        }

        #hint {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 3vh;
            width: max-content;
            margin: 0 auto;
            padding: 10px 26px;
            border-radius: 999px;
            background: rgba(255, 255, 255, .85);
            color: #b0154a;
            font-weight: 700;
            font-size: clamp(20px, 3.4vw, 30px);
            white-space: nowrap;
            box-shadow: 0 6px 24px rgba(176, 21, 74, .25);
            opacity: 0;
            pointer-events: none;
            transition: opacity .6s;
        }

        #hint.show {
            opacity: 1;
            animation: pulse 1.4s ease-in-out infinite;
        }

        #card {
            position: fixed;
            left: 50%;
            bottom: 2.5vh;
            width: min(92vw, 720px);
            box-sizing: border-box;
            padding: 16px 22px 14px;
            border-radius: 22px;
            background: rgba(255, 255, 255, .9);
            box-shadow: 0 10px 40px rgba(176, 21, 74, .3);
            text-align: center;
            color: #8e1240;
            opacity: 0;
            transform: translate(-50%, 40px);
            pointer-events: none;
            transition: opacity .9s ease, transform .9s cubic-bezier(.2, 1.4, .4, 1);
            cursor: default;
        }

        #card.show {
            opacity: 1;
            transform: translate(-50%, 0);
            pointer-events: auto;
        }

        #card .card-title {
            font-weight: 700;
            font-size: clamp(22px, 4.2vw, 34px);
            color: #c2185b;
        }

        #card .card-msg {
            margin-top: 4px;
            font-family: "Lora", "Times New Roman", serif;
            font-size: clamp(14px, 2.2vw, 18px);
            line-height: 1.5;
        }

        #replay {
            margin-top: 8px;
            border: none;
            border-radius: 999px;
            padding: 6px 18px;
            background: #e05a86;
            color: #fff;
            font: 600 15px "Lora", serif;
            cursor: pointer;
        }

        #soundBtn {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 20;
            width: 44px;
            height: 44px;
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, .8);
            box-shadow: 0 3px 12px rgba(176, 21, 74, .25);
            font-size: 20px;
            cursor: pointer;
        }

        #fx {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 10;
        }

        .spark {
            position: absolute;
            left: 0;
            top: 0;
            line-height: 1;
            will-change: transform, opacity;
        }

        .rain-petal {
            position: absolute;
            top: -40px;
            border-radius: 150% 0 150% 0;
            background: linear-gradient(135deg, #ff8fb1, #d6336c);
            opacity: .85;
            animation: petalFall linear forwards;
        }

        @keyframes petalFall {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            25% {
                transform: translate(40px, 25vh) rotate(120deg);
            }

            50% {
                transform: translate(-30px, 50vh) rotate(220deg);
            }

            75% {
                transform: translate(35px, 75vh) rotate(320deg);
            }

            100% {
                transform: translate(0, 110vh) rotate(420deg);
            }
        }
    </style>

    <!-- Lồng kính + bông hồng -->
    <style>
        .hover-animation {
            animation: hover 1.75s ease-in-out infinite;
        }

        #castle #table {
            position: absolute;
            left: 170px;
            top: 330px;
            width: 300px;
            height: 400px;
            background: radial-gradient(#a3727e, #af7279, #a16674);
            border-radius: 100%;
            border-bottom: 80px solid #623c53;
            transform: scaleY(0.225);
        }

        #castle .shade-wrap {
            position: absolute;
            left: 220px;
            top: 145px;
            width: 200px;
            height: 400px;
        }

        #castle #main {
            transform-origin: 105px 215px;
        }

        #castle #main.gifted {
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, .9));
        }

        #castle #main.gifted #flower-wrap {
            animation: giftFloat 2.6s ease-in-out infinite;
        }

        #castle .shade-wrap #shade-main {
            position: absolute;
            left: 20px;
            top: 100px;
            width: 160px;
            height: 300px;
            border-top: 1px solid rgba(255, 255, 255, 0.5);
            border-left: 1px solid rgba(255, 255, 255, 0.5);
            border-right: 1px solid rgba(255, 255, 255, 0.6);
            border-top-left-radius: 50% 30%;
            border-top-right-radius: 50% 30%;
            border-bottom: none;
            transform: perspective(200px) rotateX(8deg) scale(1.075, 1);
        }

        #castle .shade-wrap #shade-main #shade-handle-big {
            position: absolute;
            left: 55px;
            top: -14px;
            width: 50px;
            height: 30px;
            border-radius: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.7);
            transform: scaleY(0.9);
        }

        #castle .shade-wrap #shade-main #shade-handle-small {
            position: absolute;
            left: 70px;
            top: -33px;
            width: 20px;
            height: 20px;
            border-radius: 100%;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-bottom: none;
        }

        #castle .shade-wrap #shade-main #bottom-shade {
            position: absolute;
            bottom: -20px;
            width: 100%;
            height: 40px;
            transform: scaleY(0.5);
            border-radius: 100%;
            background: radial-gradient(#d287a5, #da9db6, #985e74);
            animation: floatAnimate 1.75s ease-in-out infinite;
        }

        #castle .shade-wrap #shade-main-reflections {
            position: relative;
            left: 20px;
            top: 100px;
            width: 160px;
            height: 300px;
            border-top-left-radius: 50% 30%;
            border-top-right-radius: 50% 30%;
            border-bottom: none;
            background-color: #6d6179;
            transform: perspective(200px) rotateX(8deg) scale(1.075, 1);
            opacity: 0.15;
        }

        #castle .shade-wrap #shade-main-reflections:after {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            border-top-right-radius: 50% 30%;
            border-right: 20px solid rgba(255, 255, 255, 0.5);
            transform: scale(0.7, 0.85);
            filter: blur(5px);
        }

        #castle .shade-wrap #shade-main-reflections:before {
            content: "";
            position: absolute;
            width: 100%;
            height: 100%;
            border-top-left-radius: 50% 30%;
            border-left: 8px solid rgba(255, 255, 255, 0.6);
            transform: scale(0.85, 0.85);
            filter: blur(5px);
        }

        #castle .shade-wrap #flower-wrap {
            position: relative;
            top: -50px;
        }

        #castle .shade-wrap #flower-wrap #stem {
            position: absolute;
            left: 82px;
            top: 187px;
            width: 100px;
            height: 150px;
            background-color: transparent;
            border: solid 4px #a1b965;
            border-color: transparent transparent transparent #a1b965;
            border-radius: 50%/120px 100px 0 0;
            transform: rotate(-3deg) scale(1.1, 0.9);
        }

        #castle .shade-wrap #flower-wrap #petal1 {
            position: absolute;
            left: 97px;
            top: 188px;
            width: 25px;
            height: 25px;
            border-top-left-radius: 50% 10%;
            border-top-right-radius: 50% 10%;
            border-bottom-left-radius: 50% 40%;
            border-bottom-right-radius: 50% 40%;
            background-color: #c82b60;
            box-shadow: 1px -1px 1px 0 #6f1232;
            transform: rotate(32deg) scale(1.6, 1.6);
        }

        #castle .shade-wrap #flower-wrap #petal1:before {
            content: "";
            position: absolute;
            height: 100%;
            width: 100%;
            border-top-left-radius: 50% 10%;
            border-top-right-radius: 50% 10%;
            border-bottom-left-radius: 50% 40%;
            border-bottom-right-radius: 50% 40%;
            background-color: transparent;
            box-shadow: 0 0 10px 0 #e8b2ca;
            opacity: 0.9;
        }

        #castle .shade-wrap #flower-wrap #petal1:after {
            content: "";
            position: absolute;
            height: 100%;
            width: 100%;
            border-top-left-radius: 50% 10%;
            border-top-right-radius: 50% 10%;
            border-bottom-left-radius: 50% 40%;
            border-bottom-right-radius: 50% 40%;
            background-color: transparent;
            box-shadow: 0 0 35px 0 #e8b2ca;
            animation: glow 3s ease-in-out infinite;
        }

        #castle .shade-wrap #flower-wrap #petal2 {
            position: absolute;
            left: 85px;
            top: 185px;
            width: 25px;
            height: 30px;
            border-top-left-radius: 50% 10%;
            border-top-right-radius: 50% 50%;
            border-bottom-left-radius: 50% 50%;
            border-bottom-right-radius: 50% 10%;
            background-color: #d05478;
            transform: rotate(35deg) scale(1.2, 1);
            box-shadow: 1px -1px 1px 0 #6f1232;
            opacity: 0.9;
        }

        #castle .shade-wrap #flower-wrap #petal3 {
            position: absolute;
            left: 105px;
            top: 197px;
            width: 25px;
            height: 28px;
            border-top-left-radius: 50% 50%;
            border-top-right-radius: 10% 10%;
            border-bottom-left-radius: 10% 10%;
            border-bottom-right-radius: 50% 50%;
            background-color: #cb5275;
            transform: rotate(25deg) scale(1, 1.05) skew(-8deg);
            box-shadow: 1px -1px 1px 0 #6f1232;
            opacity: 0.9;
        }

        #castle .shade-wrap #flower-wrap #petal4 {
            position: absolute;
            left: 80px;
            top: 191px;
            width: 25px;
            height: 25px;
            border-top-left-radius: 50% 10%;
            border-top-right-radius: 50% 50%;
            border-bottom-left-radius: 50% 50%;
            border-bottom-right-radius: 50% 10%;
            background-color: #d26484;
            transform: rotate(30deg) scale(1.1, 0.9) skew(10deg);
            box-shadow: 1px -1px 1px 0 #a53d60;
            opacity: 0.9;
        }

        #castle .shade-wrap #flower-wrap #petal5 {
            position: absolute;
            left: 105px;
            top: 207px;
            width: 25px;
            height: 20px;
            border-top-left-radius: 50% 50%;
            border-top-right-radius: 10% 10%;
            border-bottom-left-radius: 10% 10%;
            border-bottom-right-radius: 50% 50%;
            background-color: #d26484;
            transform: rotate(28deg) scale(1, 1.05) skew(-18deg);
            box-shadow: 1px -1px 1px 0 #a53d60;
            opacity: 0.9;
        }

        #castle .shade-wrap #flower-wrap #falling-petal {
            position: absolute;
            left: 105px;
            top: 209px;
            width: 22px;
            height: 18px;
            border-top-left-radius: 50% 50%;
            border-top-right-radius: 10% 10%;
            border-bottom-left-radius: 10% 10%;
            border-bottom-right-radius: 50% 50%;
            background-color: #da7290;
            transform: rotate(32deg) scale(0.9, 0.95) skew(-18deg);
            box-shadow: 1px -1px 1px 0 #a53d60;
            opacity: 0.9;
            animation: 7s fall 4s ease-in-out infinite;
        }

        #castle .shade-wrap #flower-wrap #leaf1 {
            position: absolute;
            left: 75px;
            top: 225px;
            width: 13px;
            height: 20px;
            border-top-left-radius: 50% 10%;
            border-top-right-radius: 50% 50%;
            border-bottom-left-radius: 50% 50%;
            border-bottom-right-radius: 50% 10%;
            background-color: #a1b965;
            transform: rotate(5deg);
        }

        #castle .shade-wrap #flower-wrap #leaf2 {
            position: absolute;
            left: 82px;
            top: 265px;
            width: 12px;
            height: 16px;
            border-top-left-radius: 50% 10%;
            border-top-right-radius: 50% 50%;
            border-bottom-left-radius: 50% 50%;
            border-bottom-right-radius: 50% 10%;
            background-color: #a1b965;
            transform: rotate(-97deg);
        }

        .dustDef {
            position: absolute;
            background-color: white;
            border-radius: 100%;
            box-shadow: 0 0 3px 1px white;
            opacity: 0;
        }

        @keyframes hover {
            0% {
                margin-top: 60px;
            }

            50% {
                margin-top: 50px;
            }

            100% {
                margin-top: 60px;
            }
        }

        @keyframes giftFloat {

            0%,
            100% {
                transform: translateY(0) rotate(-2deg);
            }

            50% {
                transform: translateY(-8px) rotate(2deg);
            }
        }

        @keyframes glow {
            0% {
                box-shadow: 0 0 25px 0 #e8b2ca;
            }

            50% {
                box-shadow: 0 0 45px 0 #e8b2ca;
            }

            100% {
                box-shadow: 0 0 25px 0 #e8b2ca;
            }
        }

        @keyframes fall {
            5% {
                top: 209px;
                left: 105px;
                transform: rotate(55deg) scale(0.9, 0.95) skew(-18deg);
                opacity: 0.9;
            }

            30% {
                left: 90px;
            }

            55% {
                left: 130px;
            }

            60%,
            100% {
                top: 380px;
                transform: rotate(30deg) scale(0.9, 0.95) skew(-32deg);
                opacity: 0;
            }
        }

        @keyframes floatAnimate {
            0% {
                background-size: 105% 120%;
                background-position: 0 0;
                opacity: 0.7;
            }

            50% {
                background-size: 100% 100%;
                background-position: 0 0;
                opacity: 0.5;
            }

            100% {
                background-size: 105% 120%;
                background-position: 0 0;
                opacity: 0.7;
            }
        }
    </style>
</head>

    <div id="castle" style="display: none;">
        <div id="stage">
            <!-- Trái tim: chữ chạy theo viền, bao quanh lồng kính -->
            <svg id="heartSvg" viewBox="0 0 800 880">
                <defs>
                    <path id="heartPath" d="M400,215
                        C455,105 735,85 735,305
                        C735,480 590,640 400,800
                        C210,640 65,480 65,305
                        C65,85 345,105 400,215 Z" />
                    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
                        <feGaussianBlur stdDeviation="4" result="b" />
                        <feMerge>
                            <feMergeNode in="b" />
                            <feMergeNode in="SourceGraphic" />
                        </feMerge>
                    </filter>
                </defs>
                <use href="#heartPath" class="heart-fill" />
                <use href="#heartPath" class="heart-line" id="heartLine" filter="url(#glow)" />
                <text class="heart-text" id="heartText">
                    <textPath href="#heartPath" id="heartTextPath"></textPath>
                </text>
            </svg>

            <div id="scene">
                <div id="table"></div>
                <div class="shade-wrap hover-animation" id="main">
                    <div id="flower-wrap">
                        <div id="stem"></div>
                        <div id="petal1"></div>
                        <div id="petal2"></div>
                        <div id="petal3"></div>
                        <div id="petal4"></div>
                        <div id="petal5"></div>
                        <div id="falling-petal"></div>
                        <div id="leaf1"></div>
                        <div id="leaf2"></div>
                    </div>
                </div>
                <div class="shade-wrap" id="sub">
                    <div id="shade-main-reflections"></div>
                    <div id="shade-main">
                        <div id="shade-handle-big"></div>
                        <div id="shade-handle-small"></div>
                        <div id="top-reflection"></div>
                        <div id="bottom-shade"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="hint">🎁 Chạm vào lồng kính để mở quà</div>

        <div id="card">
            <div class="card-title">Happy Vietnamese Women's Day 20/10 💐</div>
            <div class="card-msg">Gửi tặng cô và các bạn bông hồng này —<br>chúc mọi người luôn xinh đẹp, vui vẻ và hạnh
                phúc!</div>
            <button id="replay">↻ Xem lại</button>
        </div>
    </div>

    <script>
        const Sound = (() => {
            let ctx = null, master = null, muted = false, musicTimer = null;

            function impulse(seconds) {
                const len = ctx.sampleRate * seconds;
                const buf = ctx.createBuffer(2, len, ctx.sampleRate);
                for (let c = 0; c < 2; c++) {
                    const data = buf.getChannelData(c);
                    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
                }
                return buf;
            }

            function init() {
                if (ctx) { ctx.resume(); return; }
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                ctx = new AC();
                master = ctx.createGain();
                master.gain.value = muted ? 0 : 0.8;
                // một chút vang (reverb) cho âm thanh lung linh hơn
                const reverb = ctx.createConvolver();
                reverb.buffer = impulse(2.4);
                const wet = ctx.createGain();
                wet.gain.value = 0.35;
                master.connect(ctx.destination);
                master.connect(reverb);
                reverb.connect(wet);
                wet.connect(ctx.destination);
            }

            function tone(freq, { at = 0, dur = 1, type = "sine", vol = 0.2, attack = 0.005, slideTo = null } = {}) {
                if (!ctx) return;
                const t = ctx.currentTime + at;
                const osc = ctx.createOscillator();
                const g = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t + dur * 0.8);
                g.gain.setValueAtTime(0.0001, t);
                g.gain.linearRampToValueAtTime(vol, t + attack);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                osc.connect(g);
                g.connect(master);
                osc.start(t);
                osc.stop(t + dur + 0.05);
            }

            // tiếng hộp nhạc
            function bell(freq, at = 0, vol = 0.12) {
                tone(freq, { at, dur: 1.4, vol });
                tone(freq * 2, { at, dur: 0.6, vol: vol * 0.3 });
                tone(freq * 3, { at, dur: 0.25, vol: vol * 0.12, type: "triangle" });
            }

            function noise({ at = 0, dur = 0.6, from = 400, to = 3000, vol = 0.25, q = 1.2 } = {}) {
                if (!ctx) return;
                const t = ctx.currentTime + at;
                const len = Math.floor(ctx.sampleRate * dur);
                const buf = ctx.createBuffer(1, len, ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
                const src = ctx.createBufferSource();
                src.buffer = buf;
                const filter = ctx.createBiquadFilter();
                filter.type = "bandpass";
                filter.Q.value = q;
                filter.frequency.setValueAtTime(from, t);
                filter.frequency.exponentialRampToValueAtTime(to, t + dur);
                const g = ctx.createGain();
                g.gain.setValueAtTime(0.0001, t);
                g.gain.linearRampToValueAtTime(vol, t + dur * 0.4);
                g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
                src.connect(filter);
                filter.connect(g);
                g.connect(master);
                src.start(t);
            }

            const typingMelody = [659, 784, 880, 784, 659, 587, 523, 587, 659, 784, 1047, 880, 784, 659, 587, 659];
            let typingIndex = 0;

            const chords = [
                [523, 659, 784, 1047], // C
                [440, 523, 659, 880],  // Am
                [349, 440, 523, 698],  // F
                [392, 494, 587, 784]   // G
            ];
            const pattern = [0, 1, 2, 3, 2, 1, 2, 1];

            return {
                init,
                get muted() { return muted; },
                toggle() {
                    muted = !muted;
                    if (master) master.gain.setTargetAtTime(muted ? 0 : 0.8, ctx.currentTime, 0.05);
                    return muted;
                },
                chime() {
                    [1047, 1319, 1568, 2093].forEach((f, i) => bell(f, i * 0.09, 0.1));
                },
                type() {
                    bell(typingMelody[typingIndex++ % typingMelody.length], 0, 0.07);
                },
                glass() {
                    [2637, 3520, 4699, 3136].forEach((f, i) => {
                        tone(f, { at: i * 0.06, dur: 1.2, vol: 0.06 });
                        tone(f * 2.76, { at: i * 0.06, dur: 0.5, vol: 0.02 });
                    });
                },
                whoosh(at = 0) {
                    noise({ at, dur: 0.9, from: 300, to: 4000, vol: 0.18 });
                },
                jump(at = 0) {
                    tone(220, { at, dur: 0.45, type: "triangle", vol: 0.12, slideTo: 880 });
                },
                pop(at = 0) {
                    tone(700, { at, dur: 0.15, vol: 0.25, slideTo: 140 });
                    noise({ at, dur: 0.12, from: 2000, to: 800, vol: 0.2, q: 0.7 });
                    [1568, 2093, 2637, 3136, 2349, 2794].forEach((f, i) => bell(f, at + 0.05 + i * 0.07, 0.05));
                    [523, 659, 784, 1047].forEach(f => tone(f, { at: at + 0.05, dur: 2.8, type: "triangle", vol: 0.05, attack: 0.08 }));
                },
                startMusic() {
                    if (!ctx || musicTimer) return;
                    const step = 0.3;
                    let next = ctx.currentTime + 0.2, n = 0;
                    musicTimer = setInterval(() => {
                        while (next < ctx.currentTime + 0.6) {
                            const chord = chords[Math.floor(n / pattern.length) % chords.length];
                            const at = next - ctx.currentTime;
                            bell(chord[pattern[n % pattern.length]], at, 0.05);
                            if (n % pattern.length === 0) tone(chord[0] / 2, { at, dur: 2.2, vol: 0.05, attack: 0.05 });
                            next += step;
                            n++;
                        }
                    }, 100);
                }
            };
        })();

        const soundBtn = document.getElementById("soundBtn");
        soundBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            Sound.init();
            soundBtn.textContent = Sound.toggle() ? "🔇" : "🔊";
        });
    </script>

    <script>
        (() => {
            const HEART_TEXT = "Happy Vietnamese Women's Day 🌹_______ Best wishes to our teacher and classmates 🌹";

            const intro = document.getElementById("rose-t");
            const castle = document.getElementById("castle");
            const stage = document.getElementById("stage");
            const main = document.getElementById("main");
            const sub = document.getElementById("sub");
            const table = document.getElementById("table");
            const heartPath = document.getElementById("heartPath");
            const heartLine = document.getElementById("heartLine");
            const heartText = document.getElementById("heartText");
            const heartTextPath = document.getElementById("heartTextPath");
            const hint = document.getElementById("hint");
            const card = document.getElementById("card");
            const fx = document.getElementById("fx");

            let state = "intro"; // intro -> typing -> ready -> opening -> gifted

            // Co giãn sân khấu cho vừa mọi màn hình; khi hiện thiệp thì chừa chỗ phía dưới
            function fit() {
                const reserve = (state === "gifted" ? card.offsetHeight : hint.offsetHeight) + 30;
                const h = window.innerHeight - reserve;
                const s = Math.min(window.innerWidth / 800, h / 880) * 0.97;
                stage.style.top = h / 2 + "px";
                stage.style.transform = `translate(-50%, -50%) scale(${s})`;
            }
            window.addEventListener("resize", fit);

            setTimeout(() => document.getElementById("text-click").classList.add("show"), 4000);

            intro.addEventListener("click", () => {
                if (state !== "intro") return;
                state = "typing";
                Sound.init();
                Sound.chime();
                intro.style.display = "none";
                castle.style.display = "block";
                fit();
                startHeart();
            });

            // Chọn cỡ chữ sao cho cả câu chạy vừa khít một vòng trái tim
            function fitHeartText() {
                const pathLen = heartPath.getTotalLength();
                heartText.style.fontSize = "40px";
                heartTextPath.textContent = HEART_TEXT;
                const measured = heartText.getComputedTextLength();
                const fontSize = 40 * (pathLen * 0.9) / measured;
                heartText.style.fontSize = fontSize + "px";
                heartTextPath.setAttribute("startOffset", pathLen * 0.05);
                heartTextPath.textContent = "";
            }

            async function startHeart() {
                try {
                    await document.fonts.load('700 40px "Dancing Script"');
                } catch (e) { /* không có mạng thì dùng font dự phòng */ }
                fitHeartText();

                // vẽ viền trái tim
                const len = heartPath.getTotalLength();
                heartLine.animate(
                    [{ strokeDasharray: `0 ${len}` }, { strokeDasharray: `${len} 0` }],
                    { duration: 1500, easing: "ease-in-out", fill: "forwards" }
                );

                // gõ từng chữ theo viền trái tim, mỗi chữ một nốt nhạc
                const chars = Array.from(HEART_TEXT);
                let i = 0;
                const timer = setInterval(() => {
                    heartTextPath.textContent += chars[i];
                    if (chars[i].trim()) Sound.type();
                    if (++i >= chars.length) {
                        clearInterval(timer);
                        state = "ready";
                        hint.classList.add("show");
                        // tự mở quà nếu chưa ai chạm vào
                        setTimeout(() => { if (state === "ready") openGift(); }, 7000);
                    }
                }, 70);
            }

            castle.addEventListener("click", () => {
                if (state === "ready") openGift();
            });

            function openGift() {
                state = "opening";
                hint.classList.remove("show");

                // 1. Lồng kính lóe sáng rồi bay lên
                Sound.glass();
                sub.animate(
                    [
                        { transform: "none", opacity: 1, filter: "brightness(1)" },
                        { transform: "translateY(6px) rotate(0deg)", filter: "brightness(2.2)", offset: 0.15 },
                        { transform: "translateY(-50px) rotate(-6deg)", opacity: 1, filter: "brightness(1.4)", offset: 0.35 },
                        { transform: "translate(-260px, -620px) rotate(-40deg)", opacity: 0, filter: "brightness(1)" }
                    ],
                    { duration: 1600, easing: "ease-in-out", fill: "forwards" }
                );
                Sound.whoosh(0.35);

                // 2. Bàn biến mất, bông hồng nhún rồi nhảy ra như trao quà
                setTimeout(() => {
                    table.animate(
                        [{ opacity: 1, transform: "scaleY(0.225)" }, { opacity: 0, transform: "translateY(40px) scaleY(0.225)" }],
                        { duration: 900, easing: "ease-in", fill: "forwards" }
                    );

                    const marginTop = getComputedStyle(main).marginTop;
                    main.classList.remove("hover-animation");
                    main.style.marginTop = marginTop;

                    Sound.jump(0.25);
                    main.animate(
                        [
                            { transform: "translate(0, 0) scale(1, 1) rotate(0deg)" },
                            { transform: "translate(0, 14px) scale(1.18, 0.8) rotate(0deg)", offset: 0.2 },
                            { transform: "translate(0, -230px) scale(1.5) rotate(-14deg)", offset: 0.5 },
                            { transform: "translate(0, 160px) scale(3) rotate(8deg)", offset: 0.78 },
                            { transform: "translate(0, 125px) scale(2.65) rotate(-3deg)", offset: 0.9 },
                            { transform: "translate(0, 135px) scale(2.75) rotate(0deg)" }
                        ],
                        { duration: 1800, easing: "ease-in-out", fill: "forwards" }
                    );

                    setTimeout(() => {
                        Sound.pop();
                        burst();
                        main.classList.add("gifted");
                    }, 1350);

                    // 3. Hiện thiệp chúc, nhạc nền và mưa cánh hoa
                    setTimeout(() => {
                        state = "gifted";
                        card.classList.add("show");
                        fit();
                        Sound.startMusic();
                        startPetalRain();
                    }, 2300);
                }, 1100);
            }

            // Tim và cánh hoa bung ra từ bông hồng
            function burst() {
                const r = document.getElementById("petal1").getBoundingClientRect();
                const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
                const items = ["❤", "💖", "🌸", "✨", "💗", "🌹"];
                for (let i = 0; i < 36; i++) {
                    const el = document.createElement("span");
                    el.className = "spark";
                    el.textContent = items[i % items.length];
                    el.style.fontSize = 14 + Math.random() * 22 + "px";
                    el.style.color = "#e0245e";
                    fx.appendChild(el);
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 120 + Math.random() * Math.min(window.innerWidth, window.innerHeight) * 0.45;
                    const dx = Math.cos(angle) * dist, dy = Math.sin(angle) * dist;
                    const rot = Math.random() * 720 - 360;
                    el.animate(
                        [
                            { transform: `translate(${cx}px, ${cy}px) translate(-50%, -50%) scale(.2)`, opacity: 1 },
                            { transform: `translate(${cx + dx * 0.8}px, ${cy + dy * 0.8}px) translate(-50%, -50%) scale(1.2) rotate(${rot / 2}deg)`, opacity: 1, offset: 0.6 },
                            { transform: `translate(${cx + dx}px, ${cy + dy + 80}px) translate(-50%, -50%) scale(.8) rotate(${rot}deg)`, opacity: 0 }
                        ],
                        { duration: 1600 + Math.random() * 900, easing: "cubic-bezier(.15,.8,.3,1)", fill: "forwards" }
                    ).onfinish = () => el.remove();
                }
            }

            function startPetalRain() {
                setInterval(() => {
                    const p = document.createElement("span");
                    const size = 10 + Math.random() * 14;
                    p.className = "rain-petal";
                    p.style.left = Math.random() * 100 + "vw";
                    p.style.width = size + "px";
                    p.style.height = size + "px";
                    p.style.animationDuration = 6 + Math.random() * 5 + "s";
                    p.addEventListener("animationend", () => p.remove());
                    fx.appendChild(p);
                }, 380);
            }

            document.getElementById("replay").addEventListener("click", (e) => {
                e.stopPropagation();
                location.reload();
            });
        })();
    </script>
